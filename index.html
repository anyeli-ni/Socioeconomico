<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Acceso | Evaluación Socioeconómica</title>

    <link
        rel="stylesheet"
        href="static/css/login.css"
    >

</head>


<body>

    <main class="login-contenedor">

        <div class="login-card">

            <div class="login-encabezado">

                <div class="login-logo">
                    <img
                    src="static/img/logo-instituto.png"
                    alt="I.E.S. José Carlos Mariátegui"
                >
                </div>

                <h1>
                    Evaluación Socioeconómica
                </h1>

                <p>
                    Sistema de evaluación socioeconómica
                </p>

            </div>


            <form id="formLogin">

                <div class="campo">

                    <label for="usuario">
                        Usuario
                    </label>

                    <input
                        type="text"
                        id="usuario"
                        placeholder="Ingresa tu usuario"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Ingresa tu contraseña"
                        required
                    >

                </div>


                <p
                    id="mensajeLogin"
                    class="mensaje-login"
                ></p>


                <button
                    type="submit"
                    class="btn-login"
                >
                    Ingresar
                </button>

            </form>


            <div class="login-pie">

                <p>
                    Sistema de Evaluación Socioeconómica
                </p>

                <span>
                    I.E.S. José Carlos Mariátegui
                </span>

            </div>

        </div>

    </main>


    

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="static/js/supabase-config.js"></script>
<script src="static/js/login.js"></script>

</body>

</html>
